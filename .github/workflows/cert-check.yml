name: TLS cert check

# Independent safety net for the droplet's certbot cron: fail (and email the
# repo owner) if the live cert is close to expiry. certbot renews at 30 days
# out, so anything under 21 days means renewal has been failing for ~9 days.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check days until expiry
        env:
          HOST: labourhelpmb.ca
          MIN_DAYS: 21
        run: |
          end=$(echo | openssl s_client -connect "$HOST:443" -servername "$HOST" 2>/dev/null \
                | openssl x509 -noout -enddate | cut -d= -f2)
          if [ -z "$end" ]; then
            echo "::error::Could not read certificate from $HOST"
            exit 1
          fi
          days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "Certificate for $HOST expires $end ($days days)"
          if [ "$days" -lt "$MIN_DAYS" ]; then
            echo "::error::Certificate for $HOST expires in $days days — certbot renewal on the droplet is failing"
            exit 1
          fi
